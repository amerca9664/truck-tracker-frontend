name: ci tests

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  listFrontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: configuracion pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      - name: Instalar dependencias
        run: pnpm install
      - name: Lint
        run: pnpm lint

  testFrontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: configuracion pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      - name: Instalar dependencias
        run: pnpm install
      - name: Test
        run: pnpm test

  releaser-pleaser:
    needs: [listFrontend, testFrontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASER }}
          config-file: release-please-config.json
